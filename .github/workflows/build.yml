name: Build Standalone Binaries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: baseball_optimizer-linux
            binary_path: target/release/baseball_optimizer
          - os: macos-latest
            artifact_name: baseball_optimizer-macos
            binary_path: target/release/baseball_optimizer
          - os: windows-latest
            artifact_name: baseball_optimizer-windows
            binary_path: target/release/baseball_optimizer.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend (Outputs to static/)
        run: |
          cd frontend
          npm run build

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Build Standalone Backend (Release - Embeds static/ & models)
        run: cargo build --release

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
