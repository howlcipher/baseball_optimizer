name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  DATABASE_URL: sqlite:///test.db
  USE_PYBASEBALL: "false"

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Cargo Check
        run: cargo check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r legacy/requirements.txt -r legacy/requirements-test.txt

      - name: Run Pytest against Rust Server
        run: |
          # Build target first so verify script starts server instantly
          cargo build
          python tests/run_pytest_against_rust.py

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: htmlcov/
          if-no-files-found: ignore

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Tests
        run: |
          cd frontend
          npm run test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Build Backend
        run: |
          docker build -t baseball-backend:latest -f app/Dockerfile .

      - name: Docker Build Frontend
        run: |
          docker build -t baseball-frontend:latest -f frontend/Dockerfile ./frontend
